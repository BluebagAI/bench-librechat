# Benchmark copy of danny-avila/LibreChat's playwright-mock.yml: the whole memory suite as one
# job (upstream splits it into 10 shards of 30 minutes, so the job timeout is 60 here on every
# runner). Same steps and commit on every runner; only the main suite step differs. The three
# small extra steps (both registered-email profiles, title ownership) run the same everywhere.
# Retries and workers come from e2e/playwright.config.mock.ts with CI=true.
name: bench

on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [boba-turbo, boba-standard, github-16, blacksmith-16, github-4, blacksmith-4]
      shards:
        description: 1 runs the whole suite in one job (always on Boba). 10 is upstream's own layout.
        type: choice
        options: ['1', '10']
        default: '1'

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

env:
  NODE_OPTIONS: '--max-old-space-size=${{ secrets.NODE_MAX_OLD_SPACE_SIZE || 6144 }}'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  e2e_shards:
    name: e2e (${{ matrix.name }} ${{ matrix.shard }}, ${{ inputs.runner }})
    runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-16' && 'bench-16' || inputs.runner == 'github-4' && 'ubuntu-latest' || inputs.runner == 'blacksmith-4' && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    # One job may run the whole suite, so it gets 60 minutes instead of one shard's 30.
    timeout-minutes: 60
    # Separate runners isolate each shard's user, MongoDB, Redis and fixture state.
    # Keep workers: 1 in Playwright; shared-user cleanup is not worker-safe.
    strategy:
      fail-fast: false
      matrix:
        name: [memory]
        stream_store: [memory]
        redis_image: ['']
        suite: [full]
        shard: ${{ fromJSON(inputs.shards == '10' && '["1/10","2/10","3/10","4/10","5/10","6/10","7/10","8/10","9/10","10/10"]' || '["1/1"]') }}
    services:
      redis:
        image: ${{ matrix.redis_image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_CHROMIUM_CHANNEL: chrome
      E2E_STREAM_STORE: ${{ matrix.stream_store }}
      REDIS_URI: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5

      # Benchmark change, same on every runner: this copy deletes upstream's other workflows so
      # nothing runs on its own, but some e2e scenarios read them (static-checks.yml, ...). Put the
      # deleted files back in the working tree from the upstream-tree commit; they stay inactive.
      - name: Restore upstream's workflow files for the tests that read them
        run: |
          git fetch -q --depth=1 origin 150d5f2d08674b752139a71a2389d95bd704ee6c
          git diff --name-only --diff-filter=D FETCH_HEAD HEAD | xargs -r git checkout FETCH_HEAD --
          git status --short | wc -l

      - name: Use Node.js 24.22.1
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            client/node_modules
            packages/client/node_modules
            packages/chat/node_modules
            packages/data-provider/node_modules
            packages/data-schemas/node_modules
            packages/api/node_modules
            api/node_modules
          key: node-modules-e2e-${{ runner.os }}-24.22.1-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore data-provider build cache
        id: cache-data-provider
        uses: actions/cache@v5
        with:
          path: packages/data-provider/dist
          key: build-data-provider-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}

      - name: Build data-provider
        if: steps.cache-data-provider.outputs.cache-hit != 'true'
        run: npm run build:data-provider

      - name: Restore data-schemas build cache
        id: cache-data-schemas
        uses: actions/cache@v5
        with:
          path: packages/data-schemas/dist
          key: build-data-schemas-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'packages/data-schemas/src/**', 'packages/data-schemas/tsconfig*.json', 'packages/data-schemas/tsdown.config.mjs', 'packages/data-schemas/package.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}

      - name: Build data-schemas
        if: steps.cache-data-schemas.outputs.cache-hit != 'true'
        run: npm run build:data-schemas

      - name: Restore api build cache
        id: cache-api
        uses: actions/cache@v5
        with:
          path: packages/api/dist
          key: build-api-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'packages/api/src/**', 'packages/api/tsconfig*.json', 'packages/api/tsdown.config.mjs', 'packages/api/package.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json', 'packages/data-schemas/src/**', 'packages/data-schemas/tsconfig*.json', 'packages/data-schemas/tsdown.config.mjs', 'packages/data-schemas/package.json') }}

      - name: Build api
        if: steps.cache-api.outputs.cache-hit != 'true'
        run: npm run build:api

      - name: Restore client-package build cache
        id: cache-client-package
        uses: actions/cache@v5
        with:
          path: packages/client/dist
          key: build-client-package-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'packages/client/src/**', 'packages/client/tsconfig*.json', 'packages/client/tsdown.config.mjs', 'packages/client/package.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}

      - name: Build client-package
        if: steps.cache-client-package.outputs.cache-hit != 'true'
        run: npm run build:client-package

      # About a second, so it is not cached; the chat-package scenarios load the built entries.
      - name: Build chat package
        run: npm run build:chat

      - name: Restore client app build cache
        id: cache-client-app
        uses: actions/cache@v5
        with:
          path: client/dist
          key: build-client-app-e2e-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'client/src/**', 'client/public/**', 'client/index.html', 'client/package.json', 'client/vite.config.*', 'client/tsconfig*.json', 'client/tailwind.config.*', 'client/postcss.config.*', 'packages/client/src/**', 'packages/chat/src/**', 'packages/client/tailwind.preset.cjs', 'packages/client/tsconfig*.json', 'packages/client/tsdown.config.mjs', 'packages/client/package.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json', 'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}

      - name: Build client app
        if: steps.cache-client-app.outputs.cache-hit != 'true'
        run: npm run build:client

      - name: Verify Chrome is present
        run: google-chrome --version

      # `video: 'on-first-retry'` needs ffmpeg; without it the first retry dies in
      # browserContext.newPage before the test body runs, so a flaky test loses the
      # retry that would have recovered it.
      #
      # This step used to burn its full 90s bound on every job. Playwright's bundled
      # extractor hangs on Node 24.16.0 (a yauzl/extract-zip regression fixed in
      # Playwright 1.60.0): the 2.3MB download finished in under a second, then
      # extraction stalled and the timeout reaped it, leaving a truncated binary and
      # no INSTALLATION_COMPLETE marker — so ffmpeg was never actually installed and
      # retries never got video. With Playwright bumped past the fix the install
      # takes about a second, and a restored cache skips it outright.
      #
      # The cache is only saved once the binary is verified to run, so a partial
      # extraction can never be promoted into a cache every later job restores.
      # Kept non-fatal: retry video is a debugging aid, not something CI asserts on.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright ffmpeg cache
        id: cache-ffmpeg
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ffmpeg-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright ffmpeg (best effort)
        id: install-ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          timeout -k 10 60 npx playwright install ffmpeg
          .github/scripts/verify-playwright-ffmpeg.sh

      - name: Save Playwright ffmpeg cache
        if: steps.install-ffmpeg.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ffmpeg-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The runner's Chrome is an apt package, so its real library dependencies are
      # already satisfied; all `install-deps` adds here are optional CJK/Thai/Cyrillic
      # font packages (~21MB from azure.archive.ubuntu.com). Nothing in CI asserts on
      # them — visual baselines are opt-in via E2E_VISUAL_SNAPSHOTS — so a stalled
      # Ubuntu mirror must never be able to fail the suite.
      - name: Install optional Playwright font dependencies (best effort)
        timeout-minutes: 4
        continue-on-error: true
        run: .github/scripts/install-playwright-fonts.sh

      - name: Plan the mock-LLM shard
        if: matrix.suite == 'full'
        env:
          CI: 'true'
          E2E_SKIP: ''
          # Seconds of work memory shard 1 does after its suite (both registered-email profiles
          # and the title ownership regressions), so the plan hands it that much less of the
          # suite. Every lane of one store plans with the same value, so they agree.
          E2E_SHARD_RESERVE: ${{ matrix.stream_store == 'memory' && '1:130' || '' }}
        # Shards are planned by recorded duration, not test count: Playwright lists the suite,
        # and .github/scripts/playwright-shards.mjs assigns whole spec files longest-first to
        # the least-loaded shard, using e2e/timings.mock.json. Every shard derives the same
        # disjoint partition of the listed files, so together they run exactly the suite.
        #
        # Graduated-spec skipping (dark until repo var CODEGRAPH_E2E_SKIP=on upstream) subtracts
        # the earned skips from that listing before planning, so an unknown or stale name simply
        # matches nothing; if subtraction would drop everything, nothing is skipped. Skipped specs
        # still execute post-merge in every full-suite vote run, which is the net that catches a
        # wrong skip.
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE=e2e/.generated/playwright-list.json \
            npx playwright test --config=e2e/playwright.config.mock.ts --list --reporter=json > /dev/null
          node .github/scripts/playwright-shards.mjs plan \
            --list e2e/.generated/playwright-list.json \
            --timings e2e/timings.mock.json \
            --shard '${{ matrix.shard }}' \
            --reserve "$E2E_SHARD_RESERVE" \
            --skip "$E2E_SKIP" \
            --out e2e/.generated/shard-tests.txt

      - name: Run full mock-LLM Tier-1 e2e on Boba
        if: matrix.suite == 'full' && startsWith(inputs.runner, 'boba')
        uses: coldteadotai/boba@v1
        with:
          config: e2e/playwright.config.mock.ts
          turbo: ${{ inputs.runner == 'boba-turbo' }}
          fail-fast: false
          playwright-args: --test-list=${{ github.workspace }}/e2e/.generated/shard-tests.txt
        env:
          CI: 'true'

      - name: Run full mock-LLM Tier-1 e2e
        if: matrix.suite == 'full' && !startsWith(inputs.runner, 'boba')
        run: npx playwright test --config=e2e/playwright.config.mock.ts --test-list=${{ github.workspace }}/e2e/.generated/shard-tests.txt --reporter=list,json
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/results.json

      - name: Upload JSON results
        if: ${{ always() && !startsWith(inputs.runner, 'boba') }}
        uses: actions/upload-artifact@v6
        with:
          name: results-${{ inputs.runner }}-${{ strategy.job-index }}
          path: results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Run Redis stream transport e2e
        if: matrix.suite == 'transport'
        run: npx playwright test --config=e2e/playwright.config.redis.ts --shard=${{ matrix.shard }}
        env:
          CI: 'true'

      - name: Run registered-email change e2e
        if: startsWith(matrix.shard, '1/')
        run: npx playwright test --config=e2e/playwright.config.email.ts
        env:
          CI: 'true'

      - name: Run disabled registered-email change e2e
        if: startsWith(matrix.shard, '1/')
        run: npx playwright test --config=e2e/playwright.config.email.ts
        env:
          CI: 'true'
          E2E_ALLOW_EMAIL_CHANGE: 'false'

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-memory-${{ strategy.job-index }}
          path: e2e/playwright-report/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results-memory-${{ strategy.job-index }}
          path: e2e/specs/.test-results/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Run first-turn title ownership regressions
        if: ${{ !cancelled() && matrix.stream_store == 'memory' && startsWith(matrix.shard, '1/') }}
        env:
          CI: 'true'
          E2E_TITLE_CONVO: 'true'
        run: >-
          npx playwright test --config=e2e/playwright.config.mock.ts
          conversation-management.spec.ts --grep 'first-turn|final-title polling' --reporter=line
          --output=e2e/specs/.test-results/title-ownership

      - name: Upload title ownership diagnostics
        if: ${{ always() && matrix.stream_store == 'memory' && startsWith(matrix.shard, '1/') }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-title-ownership-memory-${{ strategy.job-index }}
          path: e2e/specs/.test-results/title-ownership/**
          retention-days: 7
          if-no-files-found: ignore

